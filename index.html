<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>Etherwake</title>
	<style>
		html, body { margin: 0; height: 100%; background: #05030d; overflow: hidden; color: #f3e6c4; font: 14px/1.4 Georgia, serif; }
		canvas { display: block; }
		#hud { position: fixed; left: 12px; bottom: 10px; opacity: .75; pointer-events: none; text-shadow: 0 1px 2px #000; }
		#prompt { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 18px; color: #ffe2b0; text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .2s; pointer-events: none; }
		#dialogue { position: fixed; left: 50%; bottom: 40px; width: min(640px, calc(100% - 32px)); transform: translate(-50%, 20px); padding: 14px 20px 16px; background: rgba(20, 10, 30, .82); border: 1px solid #b8863b; border-radius: 6px; box-shadow: 0 0 24px rgba(255, 140, 60, .25); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; box-sizing: border-box; }
		#dialogue.open { opacity: 1; transform: translate(-50%, 0); }
		#dialogue .name { color: #ffb86a; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
		#dialogue .text { font-size: 17px; line-height: 1.45; color: #f3e6c4; }
		#credits { position: fixed; right: 16px; top: 12px; font-size: 22px; color: #ffd08a; text-shadow: 0 0 10px #ff7a3a, 0 1px 2px #000; pointer-events: none; }
		#credits.pop { animation: pop .35s ease-out; }
		@keyframes pop { 0% { transform: scale( 1.25 ); } 100% { transform: scale( 1 ); } }
		#objective { position: fixed; left: 0; right: 0; top: 50px; text-align: center; font-size: 17px; color: #bff4ee; text-shadow: 0 0 8px #1a8f8a, 0 1px 2px #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
		#objective .arrow { width: 30px; height: 40px; vertical-align: middle; margin-right: 10px; overflow: visible; }
		#objective .arrow path { fill: currentColor; stroke: #0b2b2a; stroke-width: 1.5; stroke-linejoin: round; filter: drop-shadow( 0 0 4px #1a8f8a ); }
		#objective.urgent { color: #ffb0a0; text-shadow: 0 0 8px #c0402a, 0 1px 2px #000; }
		#objective.urgent .arrow path { filter: drop-shadow( 0 0 4px #c0402a ); }
		#dialogue .choices { margin-top: 10px; color: #ffcf8a; font-size: 15px; letter-spacing: .04em; white-space: pre; }
		#dialogue .choices:empty { display: none; }
		#compass { position: fixed; left: 50%; top: 8px; width: 460px; height: 36px; margin-left: -230px; overflow: hidden; pointer-events: none; border-bottom: 1px solid rgba( 184, 134, 59, .45 ); background: linear-gradient( to bottom, rgba( 20, 10, 30, .45 ), rgba( 20, 10, 30, 0 ) ); -webkit-mask-image: linear-gradient( to right, transparent, #000 15%, #000 85%, transparent ); mask-image: linear-gradient( to right, transparent, #000 15%, #000 85%, transparent ); }
		#compass::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 0; height: 0; margin-left: -5px; border: 5px solid transparent; border-bottom-color: #ffd08a; }
		#compass .tick { position: absolute; left: 50%; bottom: 2px; width: 1px; height: 6px; background: rgba( 243, 230, 196, .6 ); }
		#compass .tick.card { width: auto; height: auto; background: none; margin-left: -8px; bottom: 3px; font-size: 13px; color: #f3e6c4; }
		#compass .marker { position: absolute; left: 50%; top: 3px; font-size: 13px; white-space: nowrap; text-shadow: 0 1px 2px #000; }
		#seamap { position: fixed; left: 50%; top: 50%; transform: translate( -50%, -50% ) scale( .96 ); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
		#seamap.open { opacity: 1; transform: translate( -50%, -50% ) scale( 1 ); }
		#combo { position: fixed; left: 0; right: 0; bottom: 96px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 0 10px #ff7a3a, 0 2px 3px #000; }
		#combo.live, #combo.banked, #combo.bail { opacity: 1; }
		#combo .chain { font-size: 16px; color: #ffe2b0; letter-spacing: .03em; max-width: 80%; margin: 0 auto; }
		#combo .total { font-size: 34px; color: #ffd08a; }
		#combo .total span { font-size: 22px; color: #bff4ee; text-shadow: 0 0 10px #1a8f8a, 0 2px 3px #000; }
		#combo .link { width: 160px; height: 3px; margin: 4px auto 0; background: rgba( 255, 255, 255, .15 ); }
		#combo .link i { display: block; height: 100%; background: #ffd08a; }
		#combo.sketchy .total { color: #ffb0a0; }
		#combo.banked .total { color: #bff4ee; text-shadow: 0 0 14px #1a8f8a, 0 2px 3px #000; }
		#combo.bail .total { color: #ff8a7a; text-shadow: 0 0 12px #c0402a, 0 2px 3px #000; }
		#balance { position: fixed; left: 50%; bottom: 200px; width: 220px; height: 10px; margin-left: -110px; border: 1px solid rgba( 255, 208, 138, .6 ); border-radius: 5px; background: linear-gradient( to right, rgba( 255, 90, 70, .5 ), rgba( 255, 208, 138, .15 ) 30%, rgba( 255, 208, 138, .15 ) 70%, rgba( 255, 90, 70, .5 ) ); opacity: 0; transition: opacity .2s; pointer-events: none; }
		#balance.on { opacity: 1; }
		#balance i { position: absolute; top: -4px; left: 50%; width: 4px; height: 18px; margin-left: -2px; background: #ffd08a; box-shadow: 0 0 6px #ff7a3a; }
		#toast { position: fixed; left: 0; right: 0; top: 16%; text-align: center; font-size: 30px; letter-spacing: .04em; color: #ffd08a; text-shadow: 0 0 12px #ff7a3a, 0 2px 3px #000; opacity: 0; transition: opacity .35s; pointer-events: none; }
		body.touch { touch-action: none; -webkit-user-select: none; user-select: none; }
		body.touch #hud { display: none; }
		body.touch #dialogue.open { pointer-events: auto; }
		body.touch #dialogue .choices span { display: inline-block; padding: 6px 10px; margin: 2px 0; border: 1px solid rgba( 255, 207, 138, .35 ); border-radius: 4px; }
		#touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
		body.on-title #touch { display: none; }
		#touch .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba( 255, 208, 138, .35 ); background: rgba( 20, 10, 30, .25 ); opacity: 0; transition: opacity .15s; }
		#touch .stick.on { opacity: 1; }
		#touch .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba( 255, 208, 138, .45 ); box-shadow: 0 0 10px #ff7a3a; }
		#touch button { pointer-events: auto; touch-action: none; font: 15px Georgia, serif; color: #ffe2b0; background: rgba( 20, 10, 30, .45 ); border: 1px solid rgba( 255, 208, 138, .45 ); border-radius: 50%; text-shadow: 0 1px 2px #000; }
		#touch button.on { background: rgba( 255, 150, 70, .45 ); }
		#touch .buttons { position: absolute; right: max( 16px, env( safe-area-inset-right ) ); bottom: 16px; display: grid; grid-template-columns: repeat( 3, 64px ); grid-auto-rows: 64px; gap: 10px; direction: rtl; }
		#touch .buttons button { width: 64px; height: 64px; }
		#touch .buttons button.big { grid-row: span 2; height: 138px; border-radius: 32px; }
		#touch .small { position: absolute; right: max( 16px, env( safe-area-inset-right ) ); top: 54px; display: flex; gap: 8px; }
		#touch .small button { width: 52px; height: 32px; border-radius: 6px; font-size: 13px; }
		#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; background: radial-gradient( ellipse at 50% 45%, rgba( 10, 4, 24, .15 ), rgba( 5, 3, 13, .7 ) ); cursor: pointer; transition: opacity .9s; z-index: 10; }
		#title.closing { opacity: 0; pointer-events: none; }
		#title .name { font-size: clamp( 52px, 11vw, 120px ); letter-spacing: .08em; color: #ffd08a; text-shadow: 0 0 24px #ff7a3a, 0 0 60px rgba( 255, 120, 60, .5 ), 0 3px 4px #000; animation: breathe 6s ease-in-out infinite; }
		#title .tag { margin-top: 4px; font-size: clamp( 15px, 2.4vw, 21px ); font-style: italic; letter-spacing: .06em; color: #bff4ee; text-shadow: 0 0 10px #1a8f8a, 0 1px 2px #000; }
		#title .go { margin-top: 46px; font-size: 20px; letter-spacing: .1em; color: #f3e6c4; text-shadow: 0 1px 3px #000; animation: blink 2.4s ease-in-out infinite; }
		#title .voyage { margin-top: 12px; font-size: 15px; color: #ffcf8a; text-shadow: 0 1px 2px #000; }
		#title .quality { margin-top: 18px; padding: 6px 14px; font-size: 14px; color: #bff4ee; border: 1px solid rgba( 191, 244, 238, .4 ); border-radius: 4px; text-transform: capitalize; cursor: pointer; }
		#title .keys { position: absolute; bottom: 22px; left: 16px; right: 16px; font-size: 13px; color: rgba( 243, 230, 196, .7 ); text-shadow: 0 1px 2px #000; }
		@keyframes breathe { 50% { text-shadow: 0 0 34px #ff9a4a, 0 0 90px rgba( 255, 140, 70, .65 ), 0 3px 4px #000; } }
		@keyframes blink { 50% { opacity: .45; } }
		body.on-title #hud, body.on-title #compass, body.on-title #credits, body.on-title #objective, body.on-title #prompt, body.on-title #toast, body.on-title #combo { visibility: hidden; }
	</style>
</head>
<body>
	<div id="credits"></div>
	<div id="compass"></div>
	<div id="seamap"><canvas></canvas></div>
	<div id="toast"></div>
	<div id="combo"></div>
	<div id="balance"><i></i></div>
	<div id="prompt"></div>
	<div id="dialogue"><div class="name"></div><div class="text"></div><div class="choices"></div></div>
	<div id="objective"><svg class="arrow" viewBox="-12 -16 24 32" aria-hidden="true"><path d="M0 -15 L10 9 L0 3 L-10 9 Z" /></svg><span class="label"></span></div>
	<div id="hud">Click to look &middot; WASD move &middot; Space/C up/down &middot; Shift fast &middot; Esc release &middot; H tweaks</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
