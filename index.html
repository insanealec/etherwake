<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Etherwake</title>
	<style>
		html, body { margin: 0; height: 100%; background: #05030d; overflow: hidden; color: #f3e6c4; font: 14px/1.4 Georgia, serif; }
		canvas { display: block; }
		#hud { position: fixed; left: 12px; bottom: 10px; opacity: .75; pointer-events: none; text-shadow: 0 1px 2px #000; }
		#prompt { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 18px; color: #ffe2b0; text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .2s; pointer-events: none; }
		#dialogue { position: fixed; left: 50%; bottom: 40px; width: min(640px, calc(100% - 32px)); transform: translate(-50%, 20px); padding: 14px 20px 16px; background: rgba(20, 10, 30, .82); border: 1px solid #b8863b; border-radius: 6px; box-shadow: 0 0 24px rgba(255, 140, 60, .25); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; box-sizing: border-box; }
		#dialogue.open { opacity: 1; transform: translate(-50%, 0); }
		#dialogue .name { color: #ffb86a; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
		#dialogue .text { font-size: 17px; line-height: 1.45; color: #f3e6c4; }
		#credits { position: fixed; right: 16px; top: 12px; font-size: 22px; color: #ffd08a; text-shadow: 0 0 10px #ff7a3a, 0 1px 2px #000; pointer-events: none; }
		#credits.pop { animation: pop .35s ease-out; }
		@keyframes pop { 0% { transform: scale( 1.25 ); } 100% { transform: scale( 1 ); } }
		#objective { position: fixed; left: 0; right: 0; top: 12px; text-align: center; font-size: 17px; color: #bff4ee; text-shadow: 0 0 8px #1a8f8a, 0 1px 2px #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
		#objective .arrow { width: 30px; height: 40px; vertical-align: middle; margin-right: 10px; overflow: visible; }
		#objective .arrow path { fill: currentColor; stroke: #0b2b2a; stroke-width: 1.5; stroke-linejoin: round; filter: drop-shadow( 0 0 4px #1a8f8a ); }
		#objective.urgent { color: #ffb0a0; text-shadow: 0 0 8px #c0402a, 0 1px 2px #000; }
		#objective.urgent .arrow path { filter: drop-shadow( 0 0 4px #c0402a ); }
		#dialogue .choices { margin-top: 10px; color: #ffcf8a; font-size: 15px; letter-spacing: .04em; white-space: pre; }
		#dialogue .choices:empty { display: none; }
		#toast { position: fixed; left: 0; right: 0; top: 16%; text-align: center; font-size: 30px; letter-spacing: .04em; color: #ffd08a; text-shadow: 0 0 12px #ff7a3a, 0 2px 3px #000; opacity: 0; transition: opacity .35s; pointer-events: none; }
	</style>
</head>
<body>
	<div id="credits"></div>
	<div id="toast"></div>
	<div id="prompt"></div>
	<div id="dialogue"><div class="name"></div><div class="text"></div><div class="choices"></div></div>
	<div id="objective"><svg class="arrow" viewBox="-12 -16 24 32" aria-hidden="true"><path d="M0 -15 L10 9 L0 3 L-10 9 Z" /></svg><span class="label"></span></div>
	<div id="hud">Click to look &middot; WASD move &middot; Space/C up/down &middot; Shift fast &middot; Esc release &middot; H tweaks</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
